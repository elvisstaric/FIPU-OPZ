<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title"><title id="title">Prikaz broja korisnika površinom krugova</title><rect width="800" height="340" fill="white"/><g font-family="Arial, sans-serif" fill="#263747" font-size="15">
<text x="24" y="28" font-size="19" font-weight="bold">Zavaravajući prikaz veličine</text><text x="430" y="28" font-size="19" font-weight="bold">Površina razmjerna broju</text>
<text x="24" y="55">Broj korisnika</text><text x="430" y="55">Broj korisnika</text>
<circle cx="115" cy="170" r="35" fill="#287a91"/><circle cx="280" cy="170" r="70" fill="#b76531"/><circle cx="515" cy="170" r="35" fill="#287a91"/><circle cx="680" cy="170" r="49.4975" fill="#b76531"/>
<g text-anchor="middle"><text x="115" y="271">Prije: 100</text><text x="280" y="271">Poslije: 200</text><text x="515" y="271">Prije: 100</text><text x="680" y="271">Poslije: 200</text><text x="200" y="307">Dvostruk promjer → četverostruka površina</text><text x="600" y="307">Dvostruk broj → dvostruka površina</text><text x="400" y="333" font-size="13">Izmišljeni podaci; krugovima prikazujemo broj korisnika prije i poslije.</text></g></g></svg>
