<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title"><title id="title">Pogrešne veličine isječaka kružnog grafikona</title><rect width="800" height="340" fill="white"/><g font-family="Arial, sans-serif" fill="#263747" font-size="15"><text x="24" y="28" font-size="19" font-weight="bold">Oznake i veličine isječaka ne slažu se</text><text x="430" y="28" font-size="19" font-weight="bold">Isječci odgovaraju udjelima</text><text x="24" y="55">Način dolaska na fakultet</text><text x="430" y="55">Način dolaska na fakultet</text><path d="M195 172L195.000 76.000A96 96 0 0 1 278.138 220.000Z" fill="#287a91" stroke="white" stroke-width="2"/><path d="M195 172L278.138 220.000A96 96 0 0 1 111.862 220.000Z" fill="#b76531" stroke="white" stroke-width="2"/><path d="M195 172L111.862 220.000A96 96 0 0 1 195.000 76.000Z" fill="#8a6ca8" stroke="white" stroke-width="2"/><path d="M600 172L600.000 76.000A96 96 0 1 1 543.573 249.666Z" fill="#287a91" stroke="white" stroke-width="2"/><path d="M600 172L543.573 249.666A96 96 0 0 1 543.573 94.334Z" fill="#b76531" stroke="white" stroke-width="2"/><path d="M600 172L543.573 94.334A96 96 0 0 1 600.000 76.000Z" fill="#8a6ca8" stroke="white" stroke-width="2"/><rect x="120" y="290" width="15" height="15" fill="#287a91"/><text x="145" y="303">Autobus: 60 %</text><rect x="325" y="290" width="15" height="15" fill="#b76531"/><text x="350" y="303">Pješice: 30 %</text><rect x="530" y="290" width="15" height="15" fill="#8a6ca8"/><text x="555" y="303">Bicikl: 10 %</text><text x="400" y="333" text-anchor="middle" font-size="13">Izmišljena anketa; svaka osoba odabrala je jedan način dolaska. Legenda vrijedi za oba prikaza.</text></g></svg>
